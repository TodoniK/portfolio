    <linearGradient id="accent-hermes" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid-hermes" width="40" height="40" patternUnits="userSpaceOnUse">
