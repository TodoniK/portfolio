      <text x="25" y="332" fill="#10b981" font-family="ui-monospace, monospace" font-size="12">[2026-09-21 14:32:04] Task accepted: Multi-cloud automated architecture sync</text>
      <text x="25" y="358" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="12">[2026-09-21 14:32:05] ToolCall: dokploy_overview-services() -> returned 8 services healthy</text>
