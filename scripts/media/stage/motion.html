<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#0F1011}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Deterministic motion engine: seek(t) paints the exact frame for time t (seconds).
// Every periodic term uses integer multiples of the loop period so frame(dur) === frame(0).
const q = new URLSearchParams(location.search);
const W = +q.get("w") || 1920, H = +q.get("h") || 1080, DUR = +q.get("dur") || 8, SCENE = q.get("scene") || "hero";
const c = document.getElementById("c"); c.width = W; c.height = H;
const g = c.getContext("2d");
const TAU = Math.PI * 2;
const C = { ink: "#0F1011", ink2: "#1A1C1E", rule: "#2A2D30", paper: "#F1EEE6", muted: "#A3A099", signal: "#FF4F1A", healthy: "#3FCF8E" };

function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
// Closed-form damped spring from 0 to 1, pure function of elapsed time.
function spring(t, w = 14, z = 0.55) {
  if (t <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const loopPhase = (t, k = 1, off = 0) => ((t / DUR) * k + off) % 1;
const S = Math.min(W, H) / 1080;

function bg() {
  g.fillStyle = C.ink; g.fillRect(0, 0, W, H);
}
function vignette(strength = 0.85) {
  const r = g.createRadialGradient(W * 0.62, H * 0.42, Math.min(W, H) * 0.15, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
  r.addColorStop(0, "rgba(15,16,17,0)"); r.addColorStop(1, `rgba(15,16,17,${strength})`);
  g.fillStyle = r; g.fillRect(0, 0, W, H);
}
function grain(t, alpha = 0.035) {
  const R = rng(Math.floor(t * 30) + 7);
  g.fillStyle = `rgba(241,238,230,${alpha})`;
  const n = Math.floor(W * H / 1400);
  for (let i = 0; i < n; i++) g.fillRect(R() * W, R() * H, 1, 1);
}

/* ---------- scene: hero topology ---------- */
let topo = null;
function buildTopo() {
  const R = rng(42), nodes = [], step = 120 * S;
  const cols = Math.ceil(W / step) + 2, rows = Math.ceil(H / step) + 2;
  for (let y = -1; y < rows; y++) for (let x = -1; x < cols; x++) {
    if (R() < 0.18) continue;
    nodes.push({ x: x * step + (R() - 0.5) * step * 0.7 + (y % 2) * step * 0.5, y: y * step + (R() - 0.5) * step * 0.7, r: R(), hub: R() < 0.08 });
  }
  const edges = [];
  nodes.forEach((a, i) => {
    const near = nodes.map((b, j) => [j, (a.x - b.x) ** 2 + (a.y - b.y) ** 2]).filter(([j]) => j > i).sort((p, q) => p[1] - q[1]).slice(0, 2);
    near.forEach(([j, d]) => { if (d < (step * 1.7) ** 2) edges.push([i, j]); });
  });
  const packets = [];
  edges.forEach((e, k) => { if (R() < 0.33) packets.push({ e: k, off: R(), k: 1 + Math.floor(R() * 3), dir: R() < 0.5 }); });
  topo = { nodes, edges, packets };
}
function hero(t) {
  if (!topo) buildTopo();
  bg();
  const cx = W * 0.62, cy = H * 0.45;
  const drift = { x: Math.sin(TAU * t / DUR) * 18 * S, y: Math.cos(TAU * t / DUR) * 10 * S };
  const wave = ease(loopPhase(t)) * Math.hypot(W, H) * 0.9; // rollout front radius
  const P = (n) => ({ x: n.x + drift.x, y: n.y + drift.y });
  g.lineWidth = 1 * S;
  topo.edges.forEach(([i, j]) => {
    const a = P(topo.nodes[i]), b = P(topo.nodes[j]);
    const d = Math.hypot((a.x + b.x) / 2 - cx, (a.y + b.y) / 2 - cy);
    const lit = Math.exp(-((d - wave) ** 2) / (2 * (90 * S) ** 2));
    g.strokeStyle = lit > 0.05 ? `rgba(255,79,26,${0.12 + lit * 0.5})` : "rgba(163,160,153,0.13)";
    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
  });
  topo.packets.forEach((p) => {
    const [i, j] = topo.edges[p.e]; const a = P(topo.nodes[p.dir ? i : j]), b = P(topo.nodes[p.dir ? j : i]);
    const u = loopPhase(t, p.k, p.off);
    for (let s = 0; s < 6; s++) {
      const v = u - s * 0.025; if (v < 0) continue;
      g.fillStyle = `rgba(241,238,230,${0.75 * (1 - s / 6)})`;
      const r = (2.2 - s * 0.25) * S;
      g.beginPath(); g.arc(a.x + (b.x - a.x) * v, a.y + (b.y - a.y) * v, r, 0, TAU); g.fill();
    }
  });
  topo.nodes.forEach((n) => {
    const p = P(n), d = Math.hypot(p.x - cx, p.y - cy);
    const since = (wave - d) / (Math.hypot(W, H) * 0.9) * DUR; // seconds since front passed
    const passed = since > 0 && wave < Math.hypot(W, H) * 0.89;
    const s = passed ? spring(since * 1.2) : 0;
    const base = n.hub ? 4.5 : 2.4;
    g.fillStyle = passed && since < 1.6 ? C.signal : passed ? C.healthy : "rgba(163,160,153,0.55)";
    if (passed && since >= 1.6) g.globalAlpha = clamp(1 - (since - 1.6) / 3, 0.35, 1);
    g.beginPath(); g.arc(p.x, p.y, (base + s * 1.4) * S, 0, TAU); g.fill(); g.globalAlpha = 1;
    if (n.hub) {
      const ph = loopPhase(t, 2, n.r);
      g.strokeStyle = `rgba(241,238,230,${0.35 * (1 - ph)})`;
      g.beginPath(); g.arc(p.x, p.y, (6 + ph * 38) * S, 0, TAU); g.stroke();
    }
  });
  vignette(0.92);
  grain(t);
}

/* ---------- scene: cloud (pods autoscaling across zones) ---------- */
function cloud(t) {
  bg();
  const zones = 3, cols = 4, rows = 5;
  const pad = 70 * S, gap = 28 * S;
  const zw = (W - pad * 2 - gap * (zones - 1)) / zones, zh = H - pad * 2.2;
  const load = 0.5 - 0.5 * Math.cos(TAU * t / DUR); // 0 → 1 → 0 over the loop
  g.font = `${15 * S}px ui-monospace, monospace`;
  for (let z = 0; z < zones; z++) {
    const x0 = pad + z * (zw + gap), y0 = pad;
    g.strokeStyle = C.rule; g.lineWidth = 1 * S; g.strokeRect(x0, y0, zw, zh);
    g.fillStyle = C.muted; g.fillText(`zone-${String.fromCharCode(97 + z)}`, x0 + 14 * S, y0 + 26 * S);
    const cw = (zw - 28 * S - (cols - 1) * 10 * S) / cols, ch = (zh - 60 * S - (rows - 1) * 10 * S) / rows;
    for (let i = 0; i < cols * rows; i++) {
      const cx = x0 + 14 * S + (i % cols) * (cw + 10 * S), cy = y0 + 44 * S + Math.floor(i / cols) * (ch + 10 * S);
      const threshold = (i + z * 0.33) / (cols * rows);
      const on = load * 0.72 + 0.12 - threshold;
      const s = clamp(spring(on * 4, 16, 0.5), 0, 1.15);
      g.strokeStyle = "rgba(163,160,153,0.16)"; g.strokeRect(cx, cy, cw, ch);
      if (s > 0.01) {
        const sw = (cw - 16 * S) * s, sh = (ch - 16 * S) * s;
        const fresh = on < 0.06;
        g.strokeStyle = fresh ? C.signal : C.healthy; g.lineWidth = 1.5 * S;
        g.fillStyle = fresh ? "rgba(255,79,26,0.28)" : "rgba(63,207,142,0.16)";
        g.fillRect(cx + (cw - sw) / 2, cy + (ch - sh) / 2, sw, sh);
        g.strokeRect(cx + (cw - sw) / 2, cy + (ch - sh) / 2, sw, sh);
        g.fillStyle = fresh ? C.signal : C.healthy;
        g.fillRect(cx + cw / 2 - 3 * S, cy + ch / 2 - 3 * S, 6 * S * s, 6 * S * s);
        g.lineWidth = 1 * S;
      }
    }
  }
  // load sparkline
  g.strokeStyle = C.paper; g.lineWidth = 2 * S; g.beginPath();
  for (let i = 0; i <= 200; i++) {
    const u = i / 200, v = 0.5 - 0.5 * Math.cos(TAU * u);
    const x = pad + u * (W - pad * 2), y = H - pad * 0.55 - v * 26 * S;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
  const ux = pad + (t / DUR) * (W - pad * 2);
  g.fillStyle = C.signal; g.beginPath(); g.arc(ux, H - pad * 0.55 - load * 26 * S, 5 * S, 0, TAU); g.fill();
  grain(t, 0.03);
}

/* ---------- scene: ai (agent spawning subagents, tool calls) ---------- */
function ai(t) {
  bg();
  const cx = W / 2, cy = H / 2, R0 = Math.min(W, H) * 0.32;
  const n = 4;
  g.lineWidth = 1 * S;
  for (let ring = 1; ring <= 3; ring++) {
    g.strokeStyle = "rgba(163,160,153,0.12)"; g.beginPath(); g.arc(cx, cy, R0 * ring / 2.2, 0, TAU); g.stroke();
  }
  for (let i = 0; i < n; i++) {
    const birth = i * 0.6 + 0.3; // seconds within loop
    const life = (t - birth + DUR) % DUR;
    const grow = clamp(spring(life, 9, 0.6), 0, 1.1) * (life < DUR - 1 ? 1 : clamp((DUR - life) / 1, 0, 1));
    const ang = TAU * (i / n) + TAU * t / DUR;
    const r = R0 * (0.55 + 0.35 * (i % 2)) * grow;
    const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
    g.strokeStyle = `rgba(241,238,230,${0.25 * grow})`; g.beginPath(); g.moveTo(cx, cy); g.lineTo(x, y); g.stroke();
    for (let k = 0; k < 3; k++) {
      const u = loopPhase(t, 3, i * 0.21 + k / 3); const out = u < 0.5;
      const v = out ? u * 2 : (1 - u) * 2;
      g.fillStyle = out ? C.paper : C.healthy;
      g.globalAlpha = grow; g.beginPath(); g.arc(cx + (x - cx) * v, cy + (y - cy) * v, 3 * S, 0, TAU); g.fill(); g.globalAlpha = 1;
    }
    for (let k = 0; k < 3; k++) {
      const a2 = TAU * (k / 3) - TAU * 2 * t / DUR + i;
      const tx = x + Math.cos(a2) * 46 * S * grow, ty = y + Math.sin(a2) * 46 * S * grow;
      g.strokeStyle = `rgba(163,160,153,${0.25 * grow})`; g.lineWidth = 1 * S;
      g.beginPath(); g.moveTo(x, y); g.lineTo(tx, ty); g.stroke();
      const hit = loopPhase(t, 6, i * 0.13 + k * 0.31) < 0.18;
      g.fillStyle = hit ? C.signal : "rgba(241,238,230,0.7)"; g.globalAlpha = grow;
      g.fillRect(tx - 4 * S, ty - 4 * S, 8 * S, 8 * S); g.globalAlpha = 1;
    }
    g.fillStyle = C.ink2; g.strokeStyle = C.healthy; g.lineWidth = 2 * S;
    g.beginPath(); g.arc(x, y, 16 * S * grow, 0, TAU); g.fill(); g.stroke();
  }
  const pulse = loopPhase(t, 4);
  g.strokeStyle = `rgba(255,79,26,${0.6 * (1 - pulse)})`; g.lineWidth = 2 * S;
  g.beginPath(); g.arc(cx, cy, (28 + pulse * 70) * S, 0, TAU); g.stroke();
  g.fillStyle = C.signal; g.beginPath(); g.arc(cx, cy, 26 * S, 0, TAU); g.fill();
  g.fillStyle = C.ink; g.beginPath(); g.arc(cx, cy, 10 * S, 0, TAU); g.fill();
  grain(t, 0.03);
}

/* ---------- scene: software (code typing → build → green) ---------- */
function software(t) {
  bg();
  const R = rng(7), pad = 70 * S, lh = 34 * S, lines = Math.floor((H - pad * 2.6) / lh);
  const typing = clamp(t / (DUR * 0.55));
  const total = lines;
  for (let i = 0; i < total; i++) {
    const indent = [0, 1, 2, 2, 1, 2, 3, 1, 0][i % 9] * 34 * S;
    const w = (0.25 + R() * 0.5) * (W - pad * 2 - indent);
    const start = i / total, prog = clamp((typing - start) * total);
    const fade = t > DUR - 0.8 ? clamp((DUR - t) / 0.8) : 1;
    const y = pad + i * lh;
    g.fillStyle = "rgba(163,160,153,0.35)"; g.fillRect(pad - 44 * S, y, 18 * S, 8 * S);
    const segs = 1 + Math.floor(R() * 3);
    let x = pad + indent;
    for (let s = 0; s < segs; s++) {
      const kw = s === 0 && i % 4 === 0;
      const sw = kw ? Math.min(70 * S, w / segs - 10 * S) : w / segs - 10 * S, vis = clamp(prog * segs - s) * sw;
      g.fillStyle = kw ? `rgba(255,79,26,${0.9 * fade})` : `rgba(241,238,230,${(s % 2 ? 0.4 : 0.75) * fade})`;
      g.fillRect(x, y, vis, 10 * S); x += sw + 10 * S;
    }
    if (prog > 0 && prog < 1 && Math.floor(t * 4) % 2 === 0) { g.fillStyle = C.signal; g.fillRect(pad + indent + w * prog, y - 6 * S, 9 * S, 22 * S); }
  }
  const bx = pad, by = H - pad * 1.2, bw = W - pad * 2;
  const build = clamp((t - DUR * 0.55) / (DUR * 0.25));
  g.strokeStyle = C.rule; g.lineWidth = 1 * S; g.strokeRect(bx, by, bw, 14 * S);
  g.fillStyle = build >= 1 ? C.healthy : C.paper; g.fillRect(bx, by, bw * ease(build), 14 * S);
  if (build >= 1) {
    const s = spring(t - DUR * 0.8, 12, 0.5) * (t > DUR - 0.8 ? clamp((DUR - t) / 0.8) : 1);
    g.strokeStyle = C.healthy; g.lineWidth = 6 * S; g.beginPath();
    const ox = W - pad - 60 * S, oy = by - 70 * S;
    g.moveTo(ox, oy + 20 * S * s); g.lineTo(ox + 18 * S * s, oy + 38 * S * s); g.lineTo(ox + 52 * S * s, oy); g.stroke();
  }
  grain(t, 0.03);
}

const SCENES = { hero, cloud, ai, software };
window.seek = (t) => { SCENES[SCENE](((t % DUR) + DUR) % DUR); };
window.frame = (t, type = "image/jpeg") => { window.seek(t); return c.toDataURL(type, 0.96); };
window.seek(0);
window.READY = true;
</script>
</body>
</html>
