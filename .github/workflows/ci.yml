name: ci

# Build et tests sur chaque PR et sur main. Déploiement Cloudflare Workers :
# preview (wrangler versions upload) sur les PR, production sur main.
# Désactivé tant que le secret CLOUDFLARE_API_TOKEN n'existe pas.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f2f16be545b1fa80f7ca6622139289c9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Preview
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler versions upload --message "PR $PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.number }}
      - name: Deploy
        if: github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
