# Mises à jour automatiques. Les mineures et correctifs sont fusionnés par ci.yml une fois la CI verte,
# les majeures restent en PR pour relecture.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    # Laisse quelques jours à la communauté pour repérer une version compromise avant de l'installer.
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check n'accepte que TypeScript 5 ou 6 (peer dependency).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
